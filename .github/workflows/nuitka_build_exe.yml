# This is a workflow for testing various Nuitka command-line options

name: Build-All-Platforms

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
     strategy:
        matrix:
          # Linux builds are forwards but not backwards compatible
          os: [macos-latest, ubuntu-22.04, windows-latest]

     runs-on: ${{ matrix.os }}

     steps:
        - name: Check-out repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
             python-version: '3.10.11'
             cache: 'pip'
             cache-dependency-path: |
                **/requirements*.txt

        - name: Install your Dependencies
          run: |
             pip install -r requirements.txt

        # Install Nuitka from PyPI rather than via Nuitka/Nuitka-Action, which
        # installs it from git and fails because Nuitka's test submodules pin
        # commits that no longer exist upstream.
        - name: Install Nuitka
          run: |
             pip install nuitka==2.6.8 ordered-set==4.1.0 zstandard==0.20.0

        - name: Build Executable with Nuitka
          # Same options Nuitka-Action used by default; it's best to use
          # nuitka-project: options in your code, so e.g. you can make
          # a difference for macOS and create an app bundle there.
          run: |
             python -m nuitka --onefile --assume-yes-for-downloads --output-dir=build can_testbench.py

        - name: Upload Artifacts
          uses: actions/upload-artifact@v4
          with:
             name: ${{ runner.os }} Build
             path: | # Upload build folder
                build/can_testbench.dist/
                build/*.exe
                build/*.bin
                build/*.app/**/*
